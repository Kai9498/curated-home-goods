<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LiviSpace 後台管理系統</title>
<style>
  :root {
    --primary: #8C7A6B; --danger: #D9534F; --success: #5CB85C;
    --admin-bg: #f4f6f8; --admin-sidebar: #2c3e50; --white: #ffffff;
    --border: #E0DCD3; --radius: 8px; --shadow: 0 4px 12px rgba(0,0,0,0.05);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'PingFang TC', sans-serif; }
  body { background-color: var(--admin-bg); color: #333; height: 100vh; overflow: hidden; }
  button { cursor: pointer; border: none; background: none; font-family: inherit; }
  input, select { border: 1px solid var(--border); border-radius: 4px; padding: 8px; width: 100%; outline: none;}
  
  .btn { padding: 8px 15px; border-radius: var(--radius); cursor: pointer; font-size: 14px; transition: 0.2s; }
  .btn-primary { background: var(--primary); color: white; }
  .btn-outline { border: 1px solid var(--primary); color: var(--primary); }
  .btn-danger { background: var(--danger); color: white; }

  /* Layout */
  #view-admin-login { display:flex; justify-content:center; align-items:center; height:100vh; background: var(--admin-sidebar); }
  #view-admin { display: none; height: 100vh; }
  #view-admin.active { display: flex; }
  
  .sidebar { width: 250px; background: var(--admin-sidebar); color: white; padding: 20px; flex-shrink: 0; }
  .main-content { flex: 1; padding: 30px; overflow-y: auto; }
  
  .nav-btn { display: block; width: 100%; text-align: left; padding: 12px 15px; color: #a0aec0; border-radius: 6px; margin-bottom: 5px; }
  .nav-btn:hover, .nav-btn.active { background: #34495e; color: white; }

  /* Tables & Cards */
  .stat-card { background: white; padding: 20px; border-radius: var(--radius); box-shadow: var(--shadow); flex: 1; border-left: 4px solid var(--primary); }
  table { width: 100%; border-collapse: collapse; background: white; border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); }
  th, td { border-bottom: 1px solid var(--border); padding: 12px 10px; text-align: left; }
  th { background: #e9ecef; font-weight: bold; }

  /* Modal */
  .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
  .modal-content { background: white; padding: 25px; border-radius: var(--radius); width: 500px; }
  .form-group { margin-bottom: 15px; }
  .form-group label { display: block; font-weight: bold; margin-bottom: 5px; }
</style>
</head>
<body>

<!-- 登入畫面 -->
<div id="view-admin-login">
  <div style="background:white; padding:40px; border-radius:8px; width:400px; text-align:center;">
    <h2 style="color:var(--primary); margin-bottom: 20px;">LiviSpace 後台登入</h2>
    <div class="form-group"><input type="text" id="admin-user" placeholder="帳號 (預設: admin)"></div>
    <div class="form-group"><input type="password" id="admin-pw" placeholder="密碼 (預設: admin123)"></div>
    <button onclick="adminApp.login()" class="btn btn-primary" style="width:100%;">登入系統</button>
  </div>
</div>

<!-- 後台主畫面 -->
<div id="view-admin">
  <div class="sidebar">
    <h2 style="margin-bottom:30px;">LiviSpace 後台</h2>
    <button onclick="adminApp.switchTab('dashboard')" class="nav-btn active" id="tab-dashboard">📊 數據總覽</button>
    <button onclick="adminApp.switchTab('products')" class="nav-btn" id="tab-products">📦 商品管理</button>
    <button onclick="adminApp.switchTab('orders')" class="nav-btn" id="tab-orders">📋 訂單管理</button>
    <button onclick="adminApp.logout()" class="btn btn-outline" style="width:100%; margin-top:50px; border-color:#a0aec0; color:#a0aec0;">登出</button>
  </div>
  
  <div class="main-content">
    
    <!-- Dashboard -->
    <div id="sec-dashboard">
      <h2>數據總覽</h2>
      <div style="display:flex; gap:20px; margin: 20px 0;">
        <div class="stat-card"><h4>總營業額</h4><h2 id="stat-rev">$0</h2></div>
        <div class="stat-card"><h4>總訂單數</h4><h2 id="stat-orders">0</h2></div>
      </div>
      <h3 style="color: var(--danger); margin-bottom: 10px;">⚠️ 低庫存預警 (< 5 件)</h3>
      <table>
        <thead><tr><th>商品名稱</th><th>目前庫存</th></tr></thead>
        <tbody id="low-stock-table"></tbody>
      </table>
    </div>

    <!-- Products -->
    <div id="sec-products" style="display:none;">
      <div style="display:flex; justify-content:space-between; margin-bottom: 15px;">
        <h2>商品管理</h2>
        <button class="btn btn-primary" onclick="adminApp.openModal()">＋ 新增商品</button>
      </div>
      <table>
        <thead><tr><th>圖片</th><th>名稱</th><th>價格</th><th>庫存</th><th>操作</th></tr></thead>
        <tbody id="products-table"></tbody>
      </table>
    </div>

    <!-- Orders -->
    <div id="sec-orders" style="display:none;">
      <h2>訂單管理</h2>
      <table style="margin-top:15px;">
        <thead><tr><th>訂單編號</th><th>總金額</th><th>狀態</th><th>操作</th></tr></thead>
        <tbody id="orders-table"></tbody>
      </table>
    </div>

  </div>
</div>

<!-- Modal -->
<div id="product-modal" class="modal-overlay">
  <div class="modal-content">
    <h3 id="modal-title" style="margin-bottom: 15px;">新增/編輯商品</h3>
    <form onsubmit="adminApp.saveProduct(event)">
      <input type="hidden" id="p-id">
      <div class="form-group"><label>名稱</label><input type="text" id="p-name" required></div>
      <div class="form-group"><label>圖片網址</label><input type="text" id="p-img"></div>
      <div style="display:flex; gap:10px;">
        <div class="form-group" style="flex:1;"><label>價格</label><input type="number" id="p-price" required></div>
        <div class="form-group" style="flex:1;"><label>庫存</label><input type="number" id="p-stock" required></div>
      </div>
      <div style="text-align:right;">
        <button type="button" class="btn btn-outline" onclick="document.getElementById('product-modal').style.display='none'">取消</button>
        <button type="submit" class="btn btn-primary">儲存</button>
      </div>
    </form>
  </div>
</div>

<script>
const adminApp = {
  products: [],
  fullState: {}, // 儲存前台傳來的完整資料(包含訂單)
  isAuth: false,

  init() {
    // 讀取商品資料
    const savedDb = localStorage.getItem('liviSpaceProducts');
    if (savedDb) this.products = JSON.parse(savedDb);
    
    // 讀取訂單與系統狀態資料
    const savedState = localStorage.getItem('liviSpaceState');
    if (savedState) {
      this.fullState = JSON.parse(savedState);
      if(!this.fullState.orders) this.fullState.orders = [];
      this.isAuth = this.fullState.isAdminAuth || false;
    } else {
      this.fullState = { orders: [], isAdminAuth: false };
    }

    this.checkAuth();
  },

  checkAuth() {
    if (this.isAuth) {
      document.getElementById('view-admin-login').style.display = 'none';
      document.getElementById('view-admin').classList.add('active');
      this.switchTab('dashboard');
    } else {
      document.getElementById('view-admin-login').style.display = 'flex';
      document.getElementById('view-admin').classList.remove('active');
    }
  },

  login() {
    const u = document.getElementById('admin-user').value;
    const p = document.getElementById('admin-pw').value;
    if (u === 'admin' && p === 'admin123') {
      this.isAuth = true;
      this.fullState.isAdminAuth = true;
      localStorage.setItem('liviSpaceState', JSON.stringify(this.fullState));
      this.checkAuth();
    } else {
      alert('帳號或密碼錯誤！(預設: admin / admin123)');
    }
  },

  logout() {
    this.isAuth = false;
    this.fullState.isAdminAuth = false;
    localStorage.setItem('liviSpaceState', JSON.stringify(this.fullState));
    this.checkAuth();
  },

  switchTab(tab) {
    document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
    document.getElementById('tab-' + tab).classList.add('active');

    document.getElementById('sec-dashboard').style.display = tab === 'dashboard' ? 'block' : 'none';
    document.getElementById('sec-products').style.display = tab === 'products' ? 'block' : 'none';
    document.getElementById('sec-orders').style.display = tab === 'orders' ? 'block' : 'none';

    if(tab === 'dashboard') this.renderDashboard();
    if(tab === 'products') this.renderProducts();
    if(tab === 'orders') this.renderOrders();
  },

  renderDashboard() {
    // 重新抓取資料確保最新
    this.init(); 
    const rev = this.fullState.orders.reduce((sum, o) => sum + o.total, 0);
    document.getElementById('stat-rev').innerText = '$' + rev.toLocaleString();
    document.getElementById('stat-orders').innerText = this.fullState.orders.length;

    const lowStock = this.products.filter(p => p.stock < 5);
    document.getElementById('low-stock-table').innerHTML = lowStock.length ? 
      lowStock.map(p => `<tr><td>${p.name}</td><td style="color:red; font-weight:bold;">${p.stock}</td></tr>`).join('') 
      : '<tr><td colspan="2" style="text-align:center;">無低庫存</td></tr>';
  },

  renderProducts() {
    document.getElementById('products-table').innerHTML = this.products.map(p => `
      <tr>
        <td><img src="${p.image}" style="width:40px; height:40px; object-fit:cover;"></td>
        <td>${p.name}</td><td>$${p.price.toLocaleString()}</td><td>${p.stock}</td>
        <td>
          <button class="btn btn-outline" onclick="adminApp.openModal('${p.id}')">編輯</button>
          <button class="btn btn-danger" onclick="adminApp.deleteProduct('${p.id}')">刪除</button>
        </td>
      </tr>
    `).join('');
  },

  renderOrders() {
    this.init(); // 確保抓到前台剛下的訂單
    document.getElementById('orders-table').innerHTML = this.fullState.orders.length ? this.fullState.orders.map((o, idx) => `
      <tr>
        <td>${o.id}</td><td>$${o.total.toLocaleString()}</td>
        <td>
          <select onchange="adminApp.updateOrder(${idx}, this.value)">
            <option ${o.status==='備貨中'?'selected':''}>備貨中</option>
            <option ${o.status==='配送中'?'selected':''}>配送中</option>
            <option ${o.status==='已完成'?'selected':''}>已完成</option>
          </select>
        </td>
        <td><button class="btn btn-danger" onclick="adminApp.deleteOrder(${idx})">刪除</button></td>
      </tr>
    `).join('') : '<tr><td colspan="4" style="text-align:center;">尚無訂單</td></tr>';
  },

  updateOrder(idx, status) {
    this.fullState.orders[idx].status = status;
    localStorage.setItem('liviSpaceState', JSON.stringify(this.fullState));
    alert('訂單狀態已更新，前台會員中心也會同步顯示！');
  },

  deleteOrder(idx) {
    if(confirm('確定要刪除這筆訂單嗎？')) {
      this.fullState.orders.splice(idx, 1);
      localStorage.setItem('liviSpaceState', JSON.stringify(this.fullState));
      this.renderOrders();
    }
  },

  openModal(id = null) {
    document.getElementById('product-modal').style.display = 'flex';
    if(id) {
      document.getElementById('modal-title').innerText = '編輯商品';
      const p = this.products.find(x => x.id === id);
      document.getElementById('p-id').value = p.id;
      document.getElementById('p-name').value = p.name;
      document.getElementById('p-img').value = p.image;
      document.getElementById('p-price').value = p.price;
      document.getElementById('p-stock').value = p.stock;
    } else {
      document.getElementById('modal-title').innerText = '新增商品';
      document.getElementById('p-id').value = '';
      document.getElementById('p-name').value = '';
      document.getElementById('p-img').value = '';
      document.getElementById('p-price').value = '';
      document.getElementById('p-stock').value = '';
    }
  },

  saveProduct(e) {
    e.preventDefault();
    const id = document.getElementById('p-id').value;
    const name = document.getElementById('p-name').value;
    const imgUrl = document.getElementById('p-img').value || `https://picsum.photos/seed/${Math.floor(Math.random()*1000)}/400/300`;
    const price = parseInt(document.getElementById('p-price').value);
    const stock = parseInt(document.getElementById('p-stock').value);

    if(id) {
      const p = this.products.find(x => x.id === id);
      p.name = name; p.image = imgUrl; p.price = price; p.stock = stock;
    } else {
      this.products.unshift({
        id: 'P' + new Date().getTime().toString().slice(-4),
        name: name, image: imgUrl, price: price, stock: stock, 
        room: '客廳', style: '北歐風', originalPrice: price * 1.2
      });
    }
    
    // 存入 localStorage，讓前台抓得到
    localStorage.setItem('liviSpaceProducts', JSON.stringify(this.products));
    document.getElementById('product-modal').style.display = 'none';
    this.renderProducts();
  },

  deleteProduct(id) {
    if(confirm('確定要刪除？')) {
      this.products = this.products.filter(p => p.id !== id);
      localStorage.setItem('liviSpaceProducts', JSON.stringify(this.products));
      this.renderProducts();
    }
  }
};

window.onload = () => adminApp.init();
</script>
</body>
</html>
